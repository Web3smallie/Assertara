<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Uniswap Interface - Swap ETH to USDC</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #13141b; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1b1b22; border: 1px solid #292932; border-radius: 20px; padding: 24px; width: 420px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
    h2 { font-size: 18px; margin: 0 0 16px; color: #98a1c0; }
    .input-box { background: #21242c; border-radius: 16px; padding: 16px; margin-bottom: 8px; border: 1px solid transparent; }
    .label { font-size: 13px; color: #7780a0; margin-bottom: 6px; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .val { font-size: 28px; font-weight: 500; }
    .chip { background: #2c2f36; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 15px; }
    .btn { background: #ff007a; color: white; border: none; border-radius: 16px; padding: 16px; width: 100%; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 16px; }
    .btn:hover { background: #d90068; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Swap</h2>
    <div class="input-box">
      <div class="label">You pay</div>
      <div class="row">
        <div class="val">1.0</div>
        <div class="chip">ETH</div>
      </div>
    </div>
    <div class="input-box">
      <div class="label">You receive</div>
      <div class="row">
        <div class="val">3,450.00</div>
        <div class="chip">USDC</div>
      </div>
    </div>
    <button class="btn" onclick="triggerSwap()">Swap</button>
  </div>

  <script>
    async function triggerSwap() {
      const txPayload = {
        from: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045",
        to: "0x68b3465833fb72a70ecdf485e0e4c7bd8665fc45", // Uniswap V3 SwapRouter02
        data: "0x04e45aaf000000000000000000000000c02aaa39b223fe8d0a0e5c4f27ead9083c756cc2000000000000000000000000a0b86991c6218b36c1d19d4a2e9eb0ce3606eb4800000000000000000000000000000000000000000000000000000000000001f4",
        value: "0xde0b6b3a7640000" // 1 ETH
      };

      if (window.ethereum) {
        window.ethereum.request({ method: 'eth_sendTransaction', params: [txPayload] });
      } else {
        alert("Transaction dispatched: Swap 1 ETH -> 3,450 USDC on Uniswap V3.");
      }
    }
  </script>
</body>
</html>
