[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
test = "test"
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

# Reproducible build of the deployed V2 registry. Deployed with
# solc 0.8.20, evm_version shanghai, optimizer disabled,
# metadata bytecodeHash ipfs. Usage (sh): FOUNDRY_PROFILE=v2 forge build
# PowerShell: $env:FOUNDRY_PROFILE='v2'; forge build
[profile.v2]
src = "contracts"
out = "out-v2"
libs = ["node_modules"]
# test/ holds suites for the temp-project harness (they import ../src/...,
# which only resolves inside the e2e temp project), so the v2 profile
# compiles contracts/ only. out-v2/ keeps these artifacts separate from
# the default profile.
test = "contracts"
solc_version = "0.8.20"
evm_version = "shanghai"
optimizer = false
bytecode_hash = "ipfs"

[fuzz]
runs = 256
